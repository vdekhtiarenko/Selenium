services:
  youtrack:
    image: jetbrains/youtrack:2026.2.19840
    container_name: youtrack-selenium
    restart: unless-stopped
    ports:
      - "${YOUTRACK_PORT:-8080}:8080"
    volumes:
      - youtrack_data:/opt/youtrack/data
      - youtrack_conf:/opt/youtrack/conf
      - youtrack_logs:/opt/youtrack/logs
      - youtrack_backups:/opt/youtrack/backups

volumes:
  youtrack_data:
  youtrack_conf:
  youtrack_logs:
  youtrack_backups:
