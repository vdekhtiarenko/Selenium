services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: selenium-jenkins
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "8081:8080"
    env_file:
      - .env.jenkins
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
